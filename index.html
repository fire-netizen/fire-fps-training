<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPS 소방훈련 - 화재 표시 개선판</title><style>*{box-sizing:border-box}body{margin:0;background:#101b28;color:white;font-family:system-ui, sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:12px;left:12px;background:#071522dd;padding:12px 16px;border-radius:10px;line-height:1.7;font-size:15px}#aim{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:29px;color:#e8f8ff;pointer-events:none;text-shadow:0 0 5px #000}#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#071522d9;padding:9px 14px;border-radius:10px;text-align:center;font-size:13px;max-width:95vw}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101bdc}#panel{background:#1b3045;padding:28px;border-radius:16px;text-align:center;max-width:390px;margin:14px}button{background:#ef743b;border:0;border-radius:9px;padding:12px 20px;color:white;font-size:16px;font-weight:700;cursor:pointer}#touch{display:none;position:fixed;right:12px;bottom:75px;gap:6px;grid-template-columns:repeat(3,48px)}#touch button{padding:10px 0}#touch .fire{grid-column:3;grid-row:2;background:#177dba}@media(pointer:coarse){#touch{display:grid}#hint{bottom:8px;font-size:11px}} </style></head><body><canvas id="view"></canvas><div id="hud"><b>🚒 FPS 화재진압 훈련</b><div id="progress">진압: 0 / 6</div><div id="time">남은 시간: 120초</div><div id="water">물 잔량: 100%</div><div id="status">임무 대기</div></div><div id="aim">＋</div><div id="hint">WASD 이동 · 마우스 시점 · 클릭/스페이스 방수 · R 재충전 · ESC 일시정지</div><div id="touch"><button data-key="KeyW" style="grid-column:2">▲</button><button data-key="KeyA" style="grid-column:1">◀</button><button data-key="KeyS" style="grid-column:2">▼</button><button data-key="KeyD" style="grid-column:3">▶</button><button class="fire" id="firebtn">💧</button><button id="reload" style="grid-column:1">R</button></div><div id="menu"><div id="panel"><h1>🚒 FPS 소방훈련</h1><p>별도 설치나 외부 라이브러리 없이 실행되는 1인칭 화재진압 게임입니다.</p><p>정면 통로를 따라 배치된 화재 6곳을 진압하세요. 화재가 보이지 않으면 W키로 전진하세요.</p><button id="start">훈련 시작</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');const menu=document.getElementById('menu'),panel=document.getElementById('panel');const ui={progress:document.getElementById('progress'),time:document.getElementById('time'),water:document.getElementById('water'),status:document.getElementById('status')};const map=['1111111111111111','1000000000000001','1000000000000001','1000110000110001','1000110000110001','1000000000000001','1000000000000001','1001100001100001','1001100001100001','1000000000000001','1000000000000001','1000110000110001','1000110000110001','1000000000000001','1000000000000001','1111111111111111'];const spots=[[8.5,12.5],[7.5,10.5],[9.5,9.5],[7.5,6.5],[9.5,5.5],[8.5,2.5]];let fires=[],x=8,y=14,angle=-Math.PI/2,remaining=120,water=100,done=0,running=false,shoot=false,last=performance.now(),cool=0,mouseDown=false;const keys={};function wall(px,py){const ix=Math.floor(px),iy=Math.floor(py);return !map[iy]||map[iy][ix]!=='0'}function reset(){fires=spots.map(([fx,fy])=>({x:fx,y:fy,hp:100,active:true}));x=8;y=14;angle=-Math.PI/2;remaining=120;water=100;done=0;running=true;shoot=false;menu.style.display='none';ui.status.textContent='화재를 조준해 진압하세요';update();try{if(matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()}catch(e){}}function update(){ui.progress.textContent='진압: '+done+' / 6';ui.time.textContent='남은 시간: '+Math.ceil(remaining)+'초';ui.water.textContent='물 잔량: '+Math.ceil(water)+'%'}function end(win){running=false;shoot=false;try{if(document.pointerLockElement)document.exitPointerLock()}catch(e){}menu.style.display='flex';panel.innerHTML='<h1>'+(win?'🎉 훈련 성공!':'⏰ 훈련 종료')+'</h1><p>진압 완료: '+done+' / 6</p><button id="again">다시 시작</button>';document.getElementById('again').addEventListener('click',reset)}function pause(){if(!running)return;running=false;shoot=false;menu.style.display='flex';panel.innerHTML='<h1>⏸ 일시정지</h1><p>계속하기를 누르면 재개합니다.</p><button id="resume">계속하기</button>';document.getElementById('resume').addEventListener('click',()=>{running=true;menu.style.display='none';last=performance.now();try{canvas.requestPointerLock?.()}catch(e){}})}document.getElementById('start').addEventListener('click',reset);document.getElementById('reload').addEventListener('click',()=>{water=100;update()});document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'&&running){water=100;ui.status.textContent='물탱크 재충전 완료'}if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&running&&document.pointerLockElement!==canvas)pause()});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousemove',e=>{if(running&&document.pointerLockElement===canvas)angle+=e.movementX*.0028});document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&running&&matchMedia('(pointer:fine)').matches)pause()});canvas.addEventListener('mousedown',()=>{if(running){shoot=true;if(matchMedia('(pointer:fine)').matches&&document.pointerLockElement!==canvas)canvas.requestPointerLock?.()}});window.addEventListener('mouseup',()=>shoot=false);document.getElementById('firebtn').addEventListener('pointerdown',e=>{e.preventDefault();shoot=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('firebtn').addEventListener(ev,()=>shoot=false));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});let touchX=null;canvas.addEventListener('touchstart',e=>{touchX=e.touches[0]?.clientX??null},{passive:true});canvas.addEventListener('touchmove',e=>{if(touchX!==null&&running){angle+=(e.touches[0].clientX-touchX)*.008;touchX=e.touches[0].clientX}},{passive:true});canvas.addEventListener('touchend',()=>touchX=null);function cast(a){const dx=Math.cos(a),dy=Math.sin(a);let dist=0;while(dist<22){dist+=.035;if(wall(x+dx*dist,y+dy*dist))return dist}return 22}function draw(){const w=canvas.width=innerWidth,h=canvas.height=innerHeight;ctx.fillStyle='#8eaec5';ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#56675e';ctx.fillRect(0,h/2,w,h/2);const fov=Math.PI/2.8;const columns=Math.min(420,Math.ceil(w/3));const cw=w/columns;const depths=[];for(let i=0;i<columns;i++){const a=angle+(i/columns-.5)*fov;const d=cast(a)*Math.cos(a-angle);depths.push(d);const height=Math.min(h*2,h/(d*.82));const shade=Math.max(35,185-d*15);ctx.fillStyle='rgb('+Math.floor(shade*.69)+','+Math.floor(shade*.75)+','+Math.floor(shade*.81)+')';ctx.fillRect(i*cw,h/2-height/2,cw+1,height);ctx.fillStyle='#263544';ctx.fillRect(i*cw,h/2-height/2,cw+1,Math.max(2,height*.018))}const visible=fires.filter(f=>f.active).map(f=>{const dx=f.x-x,dy=f.y-y;const d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-angle;while(da>Math.PI)da-=2*Math.PI;while(da< -Math.PI)da+=2*Math.PI;return {...f,d,da}}).sort((a,b)=>b.d-a.d);for(const f of visible){if(Math.abs(f.da)>fov*.6||f.d<.2)continue;const sx=w/2+Math.tan(f.da)/Math.tan(fov/2)*w/2;const idx=Math.max(0,Math.min(columns-1,Math.floor(sx/cw)));if(f.d>depths[idx]+.35)continue;const size=Math.min(h*.8,h/(f.d*.65));const cy=h/2;const grad=ctx.createRadialGradient(sx,cy,2,sx,cy,size*.45);grad.addColorStop(0,'#fff9a8');grad.addColorStop(.35,'#ff9e21');grad.addColorStop(.8,'#e03c0a');grad.addColorStop(1,'#e03c0a00');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(sx,cy,size*.35,size*.62,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1b1b1bd0';ctx.fillRect(sx-size*.25,cy-size*.58,size*.5,5);ctx.fillStyle='#4cde8d';ctx.fillRect(sx-size*.25,cy-size*.58,size*.5*f.hp/100,5)}ctx.fillStyle='#253e52';ctx.fillRect(w*.72,h*.84,w*.22,h*.2);ctx.fillStyle='#48677b';ctx.fillRect(w*.77,h*.79,w*.15,h*.1);if(shoot&&running&&water>0){ctx.strokeStyle='#75dfff';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(w*.85,h*.86);ctx.lineTo(w*.5,h*.5);ctx.stroke();ctx.strokeStyle='#d4f9ff';ctx.lineWidth=3;ctx.stroke()}}function tick(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(running){remaining-=dt;if(remaining<=0){remaining=0;end(false)}else{if(keys.ArrowLeft)angle-=dt*2;if(keys.ArrowRight)angle+=dt*2;const forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),side=(keys.KeyD?1:0)-(keys.KeyA?1:0);const vx=(Math.cos(angle)*forward-Math.sin(angle)*side)*dt*3,vy=(Math.sin(angle)*forward+Math.cos(angle)*side)*dt*3;if(!wall(x+vx+Math.sign(vx)*.2,y))x+=vx;if(!wall(x,y+vy+Math.sign(vy)*.2))y+=vy;cool-=dt;if((shoot||keys.Space)&&water>0){water=Math.max(0,water-dt*16);const target=fires.filter(f=>f.active).map(f=>{const a=Math.atan2(f.y-y,f.x-x),d=Math.hypot(f.x-x,f.y-y);let da=a-angle;while(da>Math.PI)da-=2*Math.PI;while(da< -Math.PI)da+=2*Math.PI;return {f,d,da}}).filter(o=>Math.abs(o.da)<.12&&o.d<12&&cast(angle+o.da)>o.d-.25).sort((a,b)=>a.d-b.d)[0];if(target){target.f.hp-=dt*45;ui.status.textContent='🔥 화재 진압 중';if(target.f.hp<=0){target.f.active=false;done++;ui.status.textContent='✅ 화재 진압 완료';if(done===6)end(true)}}}update()}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)})();
</script></body></html>
