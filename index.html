<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D FPS 소방훈련 - 독립형</title><style>body{margin:0;background:#0b1420;color:white;font-family:system-ui,sans-serif;overflow:hidden}#hud{position:fixed;top:12px;left:12px;background:#09121bcb;padding:14px;border-radius:12px;line-height:1.8;z-index:2}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#09121bdc;padding:12px 20px;border-radius:12px;text-align:center;z-index:2}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;pointer-events:none}button{background:#ef6c34;color:white;border:0;border-radius:7px;padding:9px 15px;cursor:pointer;font-weight:bold}#menu{position:fixed;inset:0;background:#07101bdc;display:flex;align-items:center;justify-content:center;z-index:5}#panel{max-width:440px;background:#17283b;padding:30px;border-radius:18px;text-align:center}#touch{position:fixed;bottom:12px;right:12px;display:none;gap:8px;z-index:3}#touch button{min-width:48px;min-height:48px}@media(pointer:coarse){#touch{display:flex;flex-wrap:wrap;max-width:220px}#hint{bottom:105px;font-size:12px}}</style></head><body><div id="hud"><strong>🚒 3D FPS 화재진압 훈련</strong><div id="progress">진압: 0 / 6</div><div id="time">남은 시간: 120초</div><div id="water">물 잔량: 100%</div><div id="status">임무 대기</div></div><div id="cross">＋</div><div id="hint">WASD 이동 · 마우스 시점 · 클릭/스페이스 물 분사 · R 재충전 · ESC 일시정지</div><div id="touch"><button data-move="forward">▲</button><button data-move="left">◀</button><button data-move="backward">▼</button><button data-move="right">▶</button><button id="spray">💧</button><button id="reload">R</button></div><div id="menu"><div id="panel"><h1>🚒 FPS 소방훈련</h1><p>독립 실행형 3D 소방 게임입니다.<br>제한시간 안에 화재 6곳을 진압하세요.</p><p>WASD 이동 · 마우스로 조준 · 클릭하여 방수<br>R 키로 물탱크 재충전</p><button id="start">훈련 시작</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db6c7);scene.fog=new THREE.Fog(0x9db6c7,18,80);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);camera.position.set(0,1.7,12);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x52606a,2));const sun=new THREE.DirectionalLight(0xfff2dc,2);sun.position.set(8,20,12);sun.castShadow=true;scene.add(sun);
function box(w,h,d,x,y,z,color){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85}));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}box(90,.3,90,0,-.2,0,0x526d60);box(12,.12,45,0,-.01,-9,0x424a52);for(let i=0;i<8;i++)box(.16,.03,2.5,0,.07,10-i*5,0xf0d87b);
const buildings=[[-12,-12,9,9], [12,-13,9,11],[-12,8,9,8],[12,8,9,10]];for(const [x,z,w,h] of buildings){box(w,h,8,x,h/2,z,0x737f89);for(let floor=1;floor<h;floor+=2.5)for(let col=-1;col<=1;col++)box(1.2,1.2,.07,x+col*2.5,floor,z+4.05,0x263d4e)}
const fires=[];const positions=[[-10,1.1,-7.85],[-13,3.4,-7.85],[10,1.2,-8.85],[13,5,-8.85],[-11,2.5,12.1],[11,3.6,12.1]];for(const [x,y,z] of positions){const g=new THREE.Group();g.position.set(x,y,z);const flame=new THREE.Mesh(new THREE.ConeGeometry(.8,2,9),new THREE.MeshBasicMaterial({color:0xff6b0b,transparent:true,opacity:.9}));flame.position.y=.6;g.add(flame);const core=new THREE.Mesh(new THREE.ConeGeometry(.38,1.3,8),new THREE.MeshBasicMaterial({color:0xffd13b}));core.position.y=.25;g.add(core);scene.add(g);fires.push({group:g,hp:100,active:true})}
const raycaster=new THREE.Raycaster();const keys={};let yaw=0,pitch=0,running=false,remaining=120,water=100,done=0,last=performance.now(),spraying=false;const menu=document.querySelector('#menu'),panel=document.querySelector('#panel');const progress=document.querySelector('#progress'),timer=document.querySelector('#time'),waterUI=document.querySelector('#water'),status=document.querySelector('#status');function update(){progress.textContent=`진압: ${done} / ${fires.length}`;timer.textContent=`남은 시간: ${Math.ceil(remaining)}초`;waterUI.textContent=`물 잔량: ${Math.ceil(water)}%`}
function finish(win){running=false;document.exitPointerLock?.();menu.style.display='flex';panel.innerHTML=`<h1>${win?'🎉 훈련 성공!':'⏰ 훈련 종료'}</h1><p>진압 완료: ${done} / ${fires.length}<br>남은 시간: ${Math.ceil(remaining)}초</p><button id="again">다시 시작</button>`;document.querySelector('#again').onclick=reset;status.textContent=win?'임무 성공':'임무 종료'}
function reset(){for(const f of fires){f.hp=100;f.active=true;f.group.visible=true}camera.position.set(0,1.7,12);yaw=0;pitch=0;done=0;remaining=120;water=100;running=true;menu.style.display='none';status.textContent='화재를 조준해 진압하세요';update();if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()}
document.querySelector('#start').onclick=reset;document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'&&running){water=100;status.textContent='물탱크 재충전 완료';update()}if(e.code==='Space')e.preventDefault()});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement||!running)return;yaw-=e.movementX*.0025;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.0025))});document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&running&&matchMedia('(pointer:fine)').matches){running=false;menu.style.display='flex';panel.innerHTML='<h1>⏸ 일시정지</h1><button id="resume">계속하기</button>';document.querySelector('#resume').onclick=()=>{running=true;menu.style.display='none';renderer.domElement.requestPointerLock?.()}}});renderer.domElement.addEventListener('mousedown',()=>spraying=true);window.addEventListener('mouseup',()=>spraying=false);document.querySelector('#spray').addEventListener('pointerdown',()=>spraying=true);document.querySelector('#spray').addEventListener('pointerup',()=>spraying=false);document.querySelector('#reload').onclick=()=>{water=100;update()};document.querySelectorAll('[data-move]').forEach(b=>{const key={forward:'KeyW',backward:'KeyS',left:'KeyA',right:'KeyD'}[b.dataset.move];b.addEventListener('pointerdown',()=>keys[key]=true);for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[key]=false)});let touchX=null;renderer.domElement.addEventListener('touchstart',e=>{touchX=e.touches[0]?.clientX??null},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(touchX===null||!running)return;const x=e.touches[0].clientX;yaw-=(x-touchX)*.007;touchX=x},{passive:true});renderer.domElement.addEventListener('touchend',()=>touchX=null);
const stream=new THREE.Mesh(new THREE.CylinderGeometry(.035,.08,1,7),new THREE.MeshBasicMaterial({color:0x66d9ff,transparent:true,opacity:.75}));scene.add(stream);stream.visible=false;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(running){remaining-=dt;if(remaining<=0){remaining=0;finish(false)}else{camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const f=Number(!!keys.KeyW)-Number(!!keys.KeyS),s=Number(!!keys.KeyD)-Number(!!keys.KeyA);const length=Math.hypot(f,s)||1;const speed=6*dt/length;const nx=camera.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed,nz=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;const blocked=buildings.some(([bx,bz,bw])=>Math.abs(nx-bx)<bw/2+.65&&Math.abs(nz-bz)<4.65);if(!blocked){camera.position.x=Math.max(-36,Math.min(36,nx));camera.position.z=Math.max(-36,Math.min(36,nz))}const firing=(spraying||keys.Space)&&water>0;stream.visible=firing;if(firing){water=Math.max(0,water-17*dt);const direction=new THREE.Vector3();camera.getWorldDirection(direction);stream.position.copy(camera.position).addScaledVector(direction,1.1);stream.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction);raycaster.set(camera.position,direction);raycaster.far=22;const targets=fires.filter(a=>a.active).flatMap(a=>a.group.children);const hit=raycaster.intersectObjects(targets,false)[0];if(hit){const fire=fires.find(a=>a.group.children.includes(hit.object));if(fire){fire.hp-=45*dt;status.textContent='🔥 화재 진압 중';if(fire.hp<=0){fire.active=false;fire.group.visible=false;done++;status.textContent='✅ 화재 진압 완료';if(done===fires.length)finish(true)}}}}else stream.visible=false;for(const f of fires)if(f.active){f.group.children[0].scale.y=1+Math.sin(now*.009+f.group.position.x)*.12}update()}}}else stream.visible=false;renderer.render(scene,camera)}requestAnimationFrame(frame);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
