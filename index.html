<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIRE RESCUE RPG | 3D 소방훈련</title><style>*{box-sizing:border-box}body{margin:0;background:#091421;color:#eef6ff;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}#view{position:fixed;inset:0}#hud{position:fixed;top:15px;left:15px;z-index:2;background:#102238df;border:1px solid #49617c;border-radius:14px;padding:15px;max-width:340px;line-height:1.8}#hud strong{color:#ffbd73}#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#102238e8;padding:10px 17px;border-radius:12px;text-align:center;z-index:2;font-size:13px}#toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:#132c43e8;padding:14px 22px;border-radius:12px;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s}#overlay{position:fixed;inset:0;background:#07111cdb;z-index:5;display:grid;place-items:center;padding:16px}#panel{background:#162a40;border:1px solid #3c6687;border-radius:20px;padding:30px;max-width:530px;text-align:center;box-shadow:0 20px 70px #0009}h1{font-size:27px;margin:0 0 12px}button{background:#ff823d;color:#131c26;font-weight:800;border:0;border-radius:10px;padding:13px 24px;cursor:pointer;font-size:16px}button:hover{background:#ffad70}#actions{position:fixed;right:15px;bottom:68px;z-index:2;display:flex;gap:8px}#actions button{font-size:14px;padding:10px 14px}#status{color:#c5d9e8}#error{color:#ffb6a6}#bar{height:9px;background:#344b60;border-radius:9px;overflow:hidden}#fill{height:100%;background:#56c6f5;width:100%}@media(max-width:650px){#hud{font-size:12px;max-width:240px;padding:10px}#help{font-size:11px;width:95%}#actions{bottom:90px}}</style></head><body><div id="view"></div><div id="hud"><b>🚒 FIRE RESCUE RPG</b><div id="stage">임무: 준비 중</div><div id="objective">목표: 소방서에서 출동 준비</div><div id="stats">Lv.1 신입 소방관 · XP 0</div><div id="resources">체력 100 · 물 100%</div><div id="bar"><div id="fill"></div></div><div id="status">시작 대기</div></div><div id="toast"></div><div id="actions"><button id="interact">E 상호작용</button><button id="spray">💧 물 분사</button><button id="reset">처음부터</button></div><div id="help">WASD 이동 · 마우스 드래그 시점 회전 · E 상호작용 · 클릭/Space 물 분사 · R 재충전 · Shift 달리기</div><div id="overlay"><div id="panel"><h1>🚒 3D 소방훈련 RPG</h1><p>소방관을 직접 조작하는 3인칭 RPG입니다.</p><p>소방서 → 출동 → 화재진압 → 인명구조 → 종합평가</p><p id="error"> </p><button id="start" disabled>3D 엔진 불러오는 중...</button><p style="font-size:12px;color:#b5cbdc">Three.js를 사용하므로 인터넷 연결이 필요합니다.</p></div></div><script type="module">
const $=id=>document.getElementById(id);let THREE,renderer,scene,camera,player,avatar,objects=[],fires=[],victims=[],keys={},drag=false,lastX=0,yaw=0,phase=0,water=100,hp=100,xp=0,done=0,started=false,last=0,fireClock=0,shotClock=0,particles=[],running=true;const names=['소방서 출동 준비','긴급 출동','화재 진압 1','화재 진압 2','인명 구조','종합 평가'];const phases=[{pos:[0,0],target:[0,-5]},{pos:[0,0],target:[0,-8]},{pos:[0,0],target:[0,-9]},{pos:[0,0],target:[0,-9]},{pos:[0,0],target:[0,-8]}];const toast=t=>{$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,2200)};
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/+esm');init();$('start').disabled=false;$('start').textContent='훈련 시작';}catch(e){$('error').textContent='3D 엔진 로딩 실패: 인터넷 연결을 확인하고 새로고침하세요. '+e.message;$('start').textContent='실행 불가';}
function box(w,h,d,color,x,y,z,material){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material||new THREE.MeshStandardMaterial({color,roughness:.85}));m.position.set(x,y,z);scene.add(m);return m}function ball(r,color,x,y,z){let m=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.16}));m.position.set(x,y,z);scene.add(m);return m}function label(text,x,y,z,color='#fff'){let c=document.createElement('canvas');c.width=512;c.height=100;let ctx=c.getContext('2d');ctx.fillStyle='#102238d9';ctx.fillRect(0,0,512,100);ctx.fillStyle=color;ctx.textAlign='center';ctx.font='bold 38px sans-serif';ctx.fillText(text,256,65);let t=new THREE.CanvasTexture(c),s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.position.set(x,y,z);s.scale.set(4.8,.94,1);scene.add(s);return s}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8db6cd);scene.fog=new THREE.Fog(0x8db6cd,28,85);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,160);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;$('view').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd7edff,0x4b4a3e,2.1));let sun=new THREE.DirectionalLight(0xfff0d4,2.3);sun.position.set(10,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);avatar=new THREE.Group();scene.add(avatar);boxAvatar();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyE')interact();if(e.code==='KeyR'){water=100;toast('물탱크 재충전 완료')}});window.addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;if(e.button===0)shoot()});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lastX)*.006;lastX=e.clientX}});$('interact').onclick=interact;$('spray').onclick=shoot;$('reset').onclick=()=>{if(confirm('처음부터 다시 시작할까요?')){phase=0;xp=0;hp=100;water=100;loadStage()}};$('start').onclick=()=>{$('overlay').style.display='none';started=true;loadStage()};requestAnimationFrame(loop)}
function boxAvatar(){let suit=new THREE.MeshStandardMaterial({color:0xd4ae35,roughness:.7}),dark=new THREE.MeshStandardMaterial({color:0x263849}),reflect=new THREE.MeshStandardMaterial({color:0xe6ecce,emissive:0x667766,emissiveIntensity:.35});let part=(w,h,d,mat,x,y,z)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);avatar.add(m);return m};part(.8,1,.45,suit,0,1.2,0);part(.75,.13,.48,reflect,0,1.45,0);part(.6,.45,.5,dark,0,1.93,0);part(.7,.16,.6,suit,0,2.18,0);for(let s of [-1,1]){part(.26,.8,.3,suit,s*.56,1.13,0);part(.3,.75,.35,dark,s*.23,.38,0);part(.31,.1,.37,reflect,s*.23,.42,0)}part(.5,.65,.23,dark,0,1.22,.34)}
function clear(){for(let o of objects)scene.remove(o);objects=[];for(let o of [...scene.children])if(o!==avatar&&o!==camera&&!(o.isLight))scene.remove(o);fires=[];victims=[];particles=[];done=0;fireClock=0}function add(o){objects.push(o);return o}function environment(){add(box(90,.2,90,0x526a57,0,-.16,0));add(box(8,.03,70,0x34424c,0,-.035,-7));for(let z=-35;z<35;z+=5)add(box(.12,.04,2,0xe9d49c,0,.005,z));for(let i=0;i<8;i++){let x=i%2?-13:13,z=-24+Math.floor(i/2)*15;add(box(1.3,2,1.3,0x76583e,x,1,z));add(ball(2.2,0x3c8553,x,3.1,z))}}
function building(x,z,w=9,h=6,d=7){add(box(w,h,d,0x9aa5b1,x,h/2,z));add(box(w+.4,.3,d+.4,0x344458,x,h+.15,z));for(let j=0;j<2;j++)for(let i=-1;i<=1;i++){add(box(1.4,1.5,.08,0x294f6d,x+i*2.5,2+j*2.6,z+d/2+.05))}add(box(1.6,2.5,.12,0x4b3429,x,.99,z+d/2+.1))}
function fire(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let light=new THREE.PointLight(0xff5c13,3,6);light.position.y=1.2;g.add(light);for(let i=0;i<5;i++){let m=new THREE.Mesh(new THREE.ConeGeometry(.35+i*.055,1.2+i*.18,7),new THREE.MeshBasicMaterial({color:[0xff4d0a,0xffaa18,0xffdd55][i%3],transparent:true,opacity:.85}));m.position.set(Math.sin(i*2)*.27,.6+i*.12,Math.cos(i*2)*.25);g.add(m)}fires.push({g,health:100,light});add(g)}function victim(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.38,1,10),new THREE.MeshStandardMaterial({color:0x2a8ed4}));body.position.y=.75;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),new THREE.MeshStandardMaterial({color:0xf0c69b}));head.position.y=1.5;g.add(head);victims.push({g,saved:false});add(g);add(label('🆘 구조 대상',x,2.6,z))}
function loadStage(){clear();environment();player={x:0,z:8};yaw=0;water=100;if(phase===0){building(0,-8,12,5,7);add(label('소방서 / 출동 지점 E',0,6,-4));add(box(2.5,1.3,4,0xcc282b,3,.65,1));add(label('🚒 소방차',3,2,1));}if(phase===1){add(box(2.5,1.4,4,0xc8322b,0,.7,-7));add(label('현장 도착 / E',0,3,-7));for(let i=0;i<5;i++)add(box(2,.8,3,0x6e7680,6,.4,-25+i*9))}if(phase===2){building(0,-13,12,7,7);fire(-3,-8);fire(0,-8);fire(3,-8);add(label('🔥 화재 3곳 진압',0,8,-9,'#ffcb80'))}if(phase===3){building(-6,-15,9,7,7);building(6,-15,9,7,7);for(let x of [-9,-6,-3,3,6,9])fire(x,-10);add(label('🔥 화재 6곳 진압',0,8,-10,'#ffcb80'))}if(phase===4){building(0,-15,16,6,9);add(box(14,.05,15,0x53585e,0,.02,-8));victim(-4,-10);victim(4,-10);add(label('🆘 요구조자 2명 / E 구조',0,7,-11))}if(phase===5){finish();return}avatar.position.set(player.x,0,player.z);updateHud();toast(names[phase]+' 시작')}
function dist(x,z){return Math.hypot(player.x-x,player.z-z)}function interact(){if(!started||phase===5)return;if(phase===0&&dist(3,1)<4){next();return}if(phase===1&&dist(0,-7)<4){next();return}if(phase===4){let v=victims.find(v=>!v.saved&&dist(v.g.position.x,v.g.position.z)<2.6);if(v){v.saved=true;v.g.visible=false;done++;xp+=50;toast('요구조자 구조 성공! +50 XP');if(done===2)setTimeout(next,800)}else toast('요구조자에게 가까이 접근하세요');return}toast('목표 지점에 가까이 이동하세요')}
function shoot(){if(!started||![2,3].includes(phase))return;if(water<=0){toast('물이 부족합니다. R 키로 재충전하세요');return}water=Math.max(0,water-2);shotClock=.15;let nearest=null,best=1e9;for(let f of fires){if(f.health<=0)continue;let dx=f.g.position.x-player.x,dz=f.g.position.z-player.z,d=Math.hypot(dx,dz);let angle=Math.atan2(-dx,-dz),delta=Math.atan2(Math.sin(angle-yaw),Math.cos(angle-yaw));if(d<12&&Math.abs(delta)<.38&&d+Math.abs(delta)*8<best){nearest=f;best=d+Math.abs(delta)*8}}if(nearest){nearest.health-=18;nearest.g.scale.setScalar(Math.max(.12,nearest.health/100));if(nearest.health<=0){nearest.g.visible=false;done++;xp+=30;toast('화재 진압 성공! +30 XP');if(done===fires.length)setTimeout(next,850)}}updateHud()}
function next(){if(phase>=5)return;phase++;loadStage()}function finish(){let score=Math.min(100,Math.round(xp/3.3));$('overlay').style.display='grid';$('panel').innerHTML='<h1>🏆 훈련 완료!</h1><p>모든 임무를 성공적으로 수행했습니다.</p><h2>획득 경험치 '+xp+' XP</h2><p>훈련 평가: '+score+'점 / 100점</p><p>등급: '+(score>=90?'우수':score>=70?'양호':'훈련 완료')+'</p><button id="again">다시 훈련</button>';$('again').onclick=()=>{phase=0;xp=0;hp=100;water=100;$('overlay').style.display='none';loadStage()};updateHud()}
function updateHud(){$('stage').textContent='STAGE '+(phase+1)+' · '+names[phase];$('objective').textContent=phase===0?'목표: 소방차에 접근하여 E':phase===1?'목표: 현장 표시 지점에서 E':phase===2||phase===3?'목표: 화재 '+done+'/'+fires.length+'곳 진압':phase===4?'목표: 요구조자 '+done+'/2명 구조':'목표: 완료';$('stats').textContent='Lv.'+(1+Math.floor(xp/120))+' 소방관 · XP '+xp;$('resources').textContent='체력 '+hp+' · 물 '+water+'%';$('fill').style.width=water+'%';$('status').textContent=phase===2||phase===3?'불을 향해 이동 후 클릭/Space로 분사':'WASD로 이동 · E로 상호작용'}
function loop(t){requestAnimationFrame(loop);let dt=Math.min((t-last)/1000||0,.04);last=t;if(started&&phase<5){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),speed=(keys.ShiftLeft?8:5)*dt;let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;player.x=Math.max(-35,Math.min(35,player.x+dx));player.z=Math.max(-35,Math.min(35,player.z+dz));avatar.position.set(player.x,0,player.z);avatar.rotation.y=yaw;let offset=new THREE.Vector3(Math.sin(yaw)*7,5.5,Math.cos(yaw)*7);camera.position.lerp(new THREE.Vector3(player.x+offset.x,offset.y,player.z+offset.z),.15);camera.lookAt(player.x,1.35,player.z-0.3);if(keys.Space){shotClock-=dt;if(shotClock<=0)shoot()}if(phase===2||phase===3){fireClock+=dt;for(let fire of fires){if(fire.health>0){fire.g.children.forEach((o,i)=>{if(o.isMesh)o.scale.y=.85+.15*Math.sin(t*.006+i)});if(dist(fire.g.position.x,fire.g.position.z)<1.6&&fireClock>.5)hp=Math.max(1,hp-1)}}if(fireClock>.5){fireClock=0;updateHud()}}}renderer.render(scene,camera)}
</script></body></html>
